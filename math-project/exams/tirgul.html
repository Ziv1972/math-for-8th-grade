function parseNum(s){
  if(s==null) return NaN;
  let c = String(s).trim().replace(/\s/g,'').replace(',','.');
  if(c==='') return NaN;
  if(c.includes('/')){ const p=c.split('/'); return Number(p[0])/Number(p[1]); }
  return Number(c);
}
function approxEq(a,b,tol){ tol=tol||0.001; return Math.abs(a-b)<=tol; }

// ===== בנייה =====
let active = 0;

function buildTabs(){
  const nav = document.getElementById('tabs');
  nav.innerHTML = '';
  CHAPTERS.forEach((c,i)=>{
    const b = document.createElement('button');
    b.className = 'tab' + (i===active?' active':'');
    b.innerHTML = `<span class="tab-icon">${c.icon}</span><span class="tab-num">${i+1}</span><span class="tab-title">${c.title}</span>`;
    b.onclick = ()=>{ active=i; render(); window.scrollTo(0,0); };
    nav.appendChild(b);
  });
}

function makeExercise(e, idx){
  const wrap = document.createElement('div');
  wrap.className = 'ex';
  const answers = Array.isArray(e.answer)? e.answer : [e.answer];
  wrap.innerHTML = `
    <div class="ex-q"><span class="ex-num">${idx}</span><span>${e.q}</span></div>
    <div class="ex-row">
      <input class="ex-input" placeholder="התשובה שלי">
      <button class="btn-check">בדיקה</button>
      <span class="feedback"></span>
    </div>
    ${e.hint?`<details class="hint"><summary>רמז</summary><span class="hint-body">${e.hint}</span></details>`:''}
    <button class="btn-sol">פתרון מלא</button>
    <div class="solution">${e.solution}</div>
  `;
  const input = wrap.querySelector('.ex-input');
  const fb = wrap.querySelector('.feedback');
  const check = ()=>{
    const u = parseNum(input.value);
    if(isNaN(u)){ input.className='ex-input no'; fb.className='feedback no'; fb.textContent='✗ הזן מספר'; return; }
    const ok = answers.some(a=>approxEq(u,a, Math.abs(a)<1?0.01:0.05));
    if(ok){ input.className='ex-input ok'; fb.className='feedback ok'; fb.textContent='✓ מצוין!'; }
    else { input.className='ex-input no'; fb.className='feedback no'; fb.textContent='✗ נסה שוב'; }
  };
  wrap.querySelector('.btn-check').onclick = check;
  input.addEventListener('keydown', ev=>{ if(ev.key==='Enter') check(); });
  input.addEventListener('input', ()=>{ input.className='ex-input'; fb.textContent=''; });
  const sol = wrap.querySelector('.solution');
  wrap.querySelector('.btn-sol').onclick = (ev)=>{
    sol.classList.toggle('show');
    ev.target.textContent = sol.classList.contains('show')? 'הסתר פתרון':'פתרון מלא';
  };
  return wrap;
}

function makeMCQ(e, idx){
  const wrap = document.createElement('div');
  wrap.className = 'ex';
  let opts = e.options.map((o,i)=>`<button class="mcq-opt" data-i="${i}">${o}</button>`).join('');
  wrap.innerHTML = `
    <div class="ex-q"><span class="ex-num">${idx}</span><span>${e.q}</span></div>
    <div class="mcq">${opts}</div>
    <span class="feedback"></span>
    <button class="btn-sol">הסבר</button>
    <div class="solution">${e.solution}</div>
  `;
  const fb = wrap.querySelector('.feedback');
  const btns = wrap.querySelectorAll('.mcq-opt');
  let answered = false;
  btns.forEach(b=>{
    b.onclick = ()=>{
      if(answered) return;
      answered = true;
      const i = +b.dataset.i;
      if(i===e.correct){ b.className='mcq-opt ok'; fb.className='feedback ok'; fb.textContent='✓ נכון!'; }
      else { b.className='mcq-opt no'; fb.className='feedback no'; fb.textContent='✗ לא מדויק'; btns[e.correct].classList.add('reveal'); }
    };
  });
  const sol = wrap.querySelector('.solution');
  wrap.querySelector('.btn-sol').onclick = (ev)=>{
    sol.classList.toggle('show');
    ev.target.textContent = sol.classList.contains('show')? 'הסתר הסבר':'הסבר';
  };
  return wrap;
}

function render(){
  buildTabs();
  const ch = CHAPTERS[active];
  const main = document.getElementById('content');
  main.innerHTML = `
    <div class="ch-head"><span class="ch-icon">${ch.icon}</span><h2>${ch.title}</h2></div>
    <section class="intro">${ch.intro}</section>
    <h3 class="ex-header">תרגילים</h3>
    <div class="ex-list" id="exlist"></div>
    <div id="extra"></div>
    <div class="nav-btns">
      <button class="nav-btn" id="prev" ${active===0?'disabled':''}>→ הקודם</button>
      <span class="progress">${active+1} / ${CHAPTERS.length}</span>
      <button class="nav-btn" id="next" ${active===CHAPTERS.length-1?'disabled':''}>הבא ←</button>
    </div>
  `;
  const list = document.getElementById('exlist');
  ch.exercises.forEach((e,i)=>{
    list.appendChild(ch.type==='mcq'? makeMCQ(e,i+1) : makeExercise(e,i+1));
  });
  if(ch.extraSolution){
    const ex = document.getElementById('extra');
    const d = document.createElement('div');
    d.className='extra-sol'; d.innerHTML = ch.extraSolution;
    ex.appendChild(d);
  }
  const prev = document.getElementById('prev'), next = document.getElementById('next');
  if(prev) prev.onclick = ()=>{ if(active>0){active--; render(); window.scrollTo(0,0);} };
  if(next) next.onclick = ()=>{ if(active<CHAPTERS.length-1){active++; render(); window.scrollTo(0,0);} };
}

render();
</script>
