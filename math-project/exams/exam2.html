<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מבחן מסכם 2 — מתמטיקה כיתה ח'</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Assistant:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --paper:#fbfaf6;--ink:#23201a;--accent:#0f6e5c;--accent2:#b8763e;
  --rule:#d9d4c5;--good:#0f8a4d;--bad:#c4453a;--soft:#6d675a;--mark:#fef3c7;
}
body{
  font-family:'Assistant',sans-serif;background:var(--paper);
  background-image:linear-gradient(var(--rule) 1px, transparent 1px);
  background-size:100% 34px;color:var(--ink);line-height:1.7;padding-bottom:80px;
}
.sheet{max-width:780px;margin:0 auto;padding:0 22px;}
.exam-head{background:var(--paper);border-bottom:3px double var(--ink);padding:34px 0 20px;margin-bottom:8px;text-align:center;}
.exam-head .kicker{font-size:0.8rem;letter-spacing:3px;color:var(--accent2);font-weight:700;margin-bottom:8px;}
.exam-head h1{font-family:'Fraunces',serif;font-weight:700;font-size:2.2rem;color:var(--ink);}
.exam-head .meta{margin-top:12px;display:flex;gap:24px;justify-content:center;flex-wrap:wrap;font-size:0.9rem;color:var(--soft);}
.exam-head .meta b{color:var(--ink);}
.scorebar{position:sticky;top:0;z-index:30;background:rgba(251,250,246,0.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:16px;padding:12px 22px;margin:0 -22px 26px;}
.scorebar .label{font-weight:700;font-size:0.9rem;}
.scorebar .track{flex:1;height:10px;background:#ece8db;border-radius:20px;overflow:hidden;}
.scorebar .fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s ease;}
.scorebar .pct{font-family:'Fraunces',serif;font-weight:700;font-size:1.1rem;color:var(--accent);min-width:74px;text-align:left;}
.q{background:rgba(255,255,255,0.5);border:1px solid var(--rule);border-radius:4px;padding:24px 26px;margin-bottom:26px;box-shadow:2px 2px 0 rgba(35,32,26,0.04);}
.q-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;border-bottom:1px solid var(--rule);padding-bottom:12px;}
.q-badge{font-family:'Fraunces',serif;font-weight:700;font-size:1.3rem;color:#fff;background:var(--accent);width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.q-title{font-weight:700;font-size:1.05rem;flex:1;}
.q-points{font-size:0.82rem;color:var(--soft);background:var(--mark);padding:3px 10px;border-radius:12px;font-weight:600;white-space:nowrap;}
.q-stem{margin-bottom:14px;}
.q-svg{text-align:center;margin:16px 0;padding:14px;background:#fff;border:1px solid var(--rule);border-radius:4px;}
.part{padding:14px 0;border-top:1px dashed var(--rule);}
.part:first-of-type{border-top:none;}
.part-q{display:flex;gap:8px;margin-bottom:10px;align-items:baseline;}
.part-label{font-weight:700;color:var(--accent2);flex-shrink:0;}
.part-pts{font-size:0.74rem;color:var(--soft);margin-right:auto;white-space:nowrap;}
.part-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
input.ans{font-family:'Assistant';font-size:1rem;padding:9px 14px;width:150px;text-align:center;background:#fff;border:2px solid var(--rule);border-radius:4px;color:var(--ink);transition:all .2s;}
input.ans:focus{outline:none;border-color:var(--accent);}
input.ans.ok{border-color:var(--good);background:#f0faf3;}
input.ans.bad{border-color:var(--bad);background:#fdf2f1;}
.btn-check{background:var(--ink);color:var(--paper);border:none;padding:9px 20px;border-radius:4px;font-family:'Assistant';font-weight:700;font-size:0.9rem;cursor:pointer;transition:all .2s;}
.btn-check:hover{background:var(--accent);}
.verdict{font-weight:700;font-size:0.9rem;}
.verdict.ok{color:var(--good);}
.verdict.bad{color:var(--bad);}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
.opt{background:#fff;border:2px solid var(--rule);border-radius:4px;padding:11px 15px;text-align:right;font-family:'Assistant';font-size:0.98rem;color:var(--ink);cursor:pointer;transition:all .2s;}
.opt:hover{border-color:var(--accent);}
.opt.ok{border-color:var(--good);background:#f0faf3;}
.opt.bad{border-color:var(--bad);background:#fdf2f1;}
.opt.reveal{border-color:var(--good);background:#f0faf3;}
.tools{margin-top:12px;display:flex;gap:14px;flex-wrap:wrap;}
.btn-hint,.btn-sol{background:none;border:none;font-family:'Assistant';font-weight:600;font-size:0.85rem;cursor:pointer;padding:0;}
.btn-hint{color:var(--accent2);}
.btn-sol{color:var(--accent);text-decoration:underline;}
.hint-box{display:none;margin-top:8px;padding:10px 14px;background:var(--mark);border-radius:4px;font-size:0.9rem;}
.hint-box.show{display:block;}
.sol-box{display:none;margin-top:10px;padding:14px 16px;background:#f3f6f4;border-right:3px solid var(--accent);border-radius:4px;font-size:0.93rem;line-height:1.75;}
.sol-box.show{display:block;}
.sol-box b{color:var(--accent);}
.formula{direction:ltr;unicode-bidi:isolate;font-family:'Times New Roman',serif;font-weight:600;white-space:nowrap;}
.finish{text-align:center;padding:30px;margin-top:30px;border:3px double var(--ink);border-radius:4px;background:#fff;}
.finish h2{font-family:'Fraunces',serif;font-size:1.6rem;margin-bottom:10px;}
.finish .final-score{font-family:'Fraunces',serif;font-size:3rem;font-weight:700;color:var(--accent);}
.finish .msg{color:var(--soft);margin-top:8px;}
.btn-finish{background:var(--accent);color:#fff;border:none;padding:13px 32px;border-radius:4px;font-family:'Assistant';font-weight:700;font-size:1rem;cursor:pointer;margin-top:16px;}
.btn-finish:hover{background:var(--accent2);}
@media (max-width:600px){.exam-head h1{font-size:1.6rem;}.q{padding:18px;}}
</style>
</head>
<body>
<div class="scorebar">
  <span class="label">ציון</span>
  <div class="track"><div class="fill" id="scoreFill"></div></div>
  <span class="pct" id="scorePct">0 / 100</span>
</div>
<div class="sheet">
  <div class="exam-head">
    <div class="kicker">מתמטיקה · כיתה ח' · מועד ב'</div>

    </div>

  </div>
</div>

<script>
const EXAM = [
  // ===== שאלה 1: זוויות במצולע ובמשולש (14 נק') =====
  {
    id:"q1", topic:"polygons", points:14, title:"זוויות במצולע ובמשולש",
    stem:'פתרו את הסעיפים הבאים בנושא זוויות.',
    parts:[
      {id:"a",label:"(א)",text:'מהו סכום הזוויות הפנימיות במחומש (מצולע בעל 5 צלעות)? (במעלות)',type:"number",answer:540,points:4,
       hint:"נוסחה: (n−2)·180 כאשר n הוא מספר הצלעות",solution:'(5 − 2) · 180 = 3 · 180 = <b>540°</b>'},
      {id:"b",label:"(ב)",text:'במחומש ארבע מזוויותיו הן 100°, 110°, 105° ו-115°. כמה מעלות הזווית החמישית?',type:"number",answer:110,points:5,
       hint:"סכום כל הזוויות במחומש הוא 540°",solution:'540 − (100 + 110 + 105 + 115) = 540 − 430 = <b>110°</b>'},
      {id:"c",label:"(ג)",text:'זווית חיצונית למשולש שווה ל-130°. אחת הזוויות הפנימיות הרחוקות היא 70°. כמה מעלות הזווית הפנימית הרחוקה השנייה?',type:"number",answer:60,points:5,
       hint:"זווית חיצונית = סכום שתי הזוויות הפנימיות שאינן צמודות לה",solution:'הזווית החיצונית שווה לסכום שתי הפנימיות הרחוקות: 130 − 70 = <b>60°</b>'}
    ]
  },
  // ===== שאלה 2: פונקציה קווית + שטח (13 נק') =====
  {
    id:"q2", topic:"lineeq", points:13, title:"פונקציה קווית ושטח",
    stem:'נתון הישר <span class="formula" dir="ltr">y = −2x + 6</span>. הישר חותך את ציר ה-x בנקודה A ואת ציר ה-y בנקודה B. הנקודה O היא ראשית הצירים.',
    svg:'<svg viewBox="0 0 260 260" style="max-width:240px"><line x1="20" y1="130" x2="240" y2="130" stroke="#888" stroke-width="1.5"/><line x1="130" y1="20" x2="130" y2="240" stroke="#888" stroke-width="1.5"/><polygon points="240,130 232,126 232,134" fill="#888"/><polygon points="130,20 126,28 134,28" fill="#888"/><text x="243" y="134" font-size="12" fill="#888">x</text><text x="120" y="18" font-size="12" fill="#888">y</text><line x1="70" y1="50" x2="200" y2="180" stroke="#0f6e5c" stroke-width="2.5"/><circle cx="190" cy="130" r="3.5" fill="#c4453a"/><circle cx="130" cy="70" r="3.5" fill="#c4453a"/><text x="194" y="124" font-size="12" fill="#c4453a">A</text><text x="112" y="68" font-size="12" fill="#c4453a">B</text><text x="116" y="126" font-size="11" fill="#555">O</text></svg>',
    parts:[
      {id:"a",label:"(א)",text:'מהו ערך ה-x של נקודה A (החיתוך עם ציר x)?',type:"number",answer:3,points:3,
       hint:"בחיתוך עם ציר x מתקיים y=0",solution:'0 = −2x + 6 → 2x = 6 → <b>x = 3</b>. לכן A = (3, 0)'},
      {id:"b",label:"(ב)",text:'מהו ערך ה-y של נקודה B (החיתוך עם ציר y)?',type:"number",answer:6,points:3,
       hint:"בחיתוך עם ציר y מתקיים x=0",solution:'y = −2·0 + 6 = <b>6</b>. לכן B = (0, 6)'},
      {id:"c",label:"(ג)",text:'חשבו את שטח המשולש AOB (ביחידות ריבועיות).',type:"number",answer:9,points:4,
       hint:"המשולש ישר-זווית ב-O. הניצבים הם OA=3 ו-OB=6",solution:'שטח = (OA · OB)/2 = (3 · 6)/2 = <b>9 יח"ר</b>'},
      {id:"d",label:"(ד)",text:'האם הנקודה (1, 4) נמצאת על הישר? (רשמו 1 לכן, 0 ללא)',type:"number",answer:1,points:3,
       hint:"הציבו x=1 ובדקו אם מתקבל y=4",solution:'−2·1 + 6 = 4 ✓ הנקודה על הישר. תשובה: <b>1</b>'}
    ]
  },
  // ===== שאלה 3: מערכת משוואות אלגברי — בסיסי (12 נק') =====
  {
    id:"q3", topic:"systems", points:12, title:"מערכת משוואות — שיטות פתרון",
    stem:'פתרו את שתי מערכות המשוואות. שימו לב לשיטה המתאימה לכל אחת (חיבור / הצבה).',
    parts:[
      {id:"a1",label:"(א) x:",text:'במערכת <span class="formula" dir="ltr">4x + y = 14</span> , <span class="formula" dir="ltr">2x − y = 4</span> — מהו ערך x?',type:"number",answer:3,points:3,
       hint:"חברו את שתי המשוואות כדי לבטל את y (כי יש +y ו-−y)",solution:'חיבור: (4x+y)+(2x−y) = 14+4 → 6x = 18 → <b>x = 3</b>'},
      {id:"a2",label:"(א) y:",text:'באותה מערכת — מהו ערך y?',type:"number",answer:2,points:3,
       hint:"הציבו x=3 במשוואה הראשונה",solution:'4·3 + y = 14 → 12 + y = 14 → <b>y = 2</b>'},
      {id:"b1",label:"(ב) x:",text:'במערכת <span class="formula" dir="ltr">x = 2y</span> , <span class="formula" dir="ltr">3x − y = 15</span> — מהו ערך x?',type:"number",answer:6,points:3,
       hint:"הציבו x=2y במשוואה השנייה: 3(2y)−y=15",solution:'3(2y) − y = 15 → 6y − y = 15 → 5y = 15 → y = 3, ולכן <b>x = 6</b>'},
      {id:"b2",label:"(ב) y:",text:'באותה מערכת — מהו ערך y?',type:"number",answer:3,points:3,
       hint:"מצאת ש-5y=15",solution:'5y = 15 → <b>y = 3</b>'}
    ]
  },
  // ===== שאלה 4: מערכת משוואות מתקדם — סוגריים ושברים (13 נק') =====
  {
    id:"q4", topic:"systems", points:13, title:"מערכת משוואות — סוגריים ושברים",
    stem:'מערכות אלה דורשות פישוט לפני הפתרון: פתיחת סוגריים או היפטרות משברים. פתרו בזהירות.',
    parts:[
      {id:"a1",label:"(א) x:",text:'במערכת <span class="formula" dir="ltr">2(x + y) = x + 10</span> , <span class="formula" dir="ltr">x − y = 1</span> — מהו ערך x? (פתחו תחילה את הסוגריים)',type:"number",answer:4,points:4,
       hint:"פתחו: 2x+2y = x+10 → x+2y = 10. עכשיו יש מערכת פשוטה עם x−y=1",solution:'פתיחת סוגריים: 2x + 2y = x + 10 → x + 2y = 10. נחבר עם x−y=1 (כפול 2: 2x−2y=2). חיבור עם x+2y=10: 3x=12 → <b>x = 4</b>'},
      {id:"a2",label:"(א) y:",text:'באותה מערכת — מהו ערך y?',type:"number",answer:3,points:2,
       hint:"הציבו x=4 ב-x−y=1",solution:'4 − y = 1 → <b>y = 3</b>. בדיקה: 2(4+3)=14 ו-4+10=14 ✓'},
      {id:"b1",label:"(ב) x:",text:'במערכת <span class="formula" dir="ltr">x/2 + y = 7</span> , <span class="formula" dir="ltr">x − y = 2</span> — מהו ערך x? (היפטרו תחילה מהשבר)',type:"number",answer:6,points:5,
       hint:"הכפילו את המשוואה הראשונה ב-2: x+2y=14. חברו עם x−y=2",solution:'הכפלת המשוואה הראשונה ב-2: x + 2y = 14. מ-x−y=2 נקבל x=y+2. הצבה: (y+2)+2y=14 → 3y=12 → y=4, ולכן <b>x = 6</b>'},
      {id:"b2",label:"(ב) y:",text:'באותה מערכת — מהו ערך y?',type:"number",answer:4,points:2,
       hint:"מצאת ש-3y=12",solution:'3y = 12 → <b>y = 4</b>. בדיקה: 6/2+4=7 ✓ ו-6−4=2 ✓'}
    ]
  },
  // ===== שאלה 5: בעיה מילולית במערכת — כרטיסים (13 נק') =====
  {
    id:"q5", topic:"systems", points:13, title:"בעיה מילולית — כרטיסים",
    stem:'משפחה קנתה כרטיסים להצגה. 2 כרטיסי מבוגר ו-3 כרטיסי ילד עלו יחד 160 ש"ח. ידוע שכרטיס מבוגר יקר ב-10 ש"ח מכרטיס ילד.',
    parts:[
      {id:"a",label:"(א)",text:'אם נסמן מחיר כרטיס ילד ב-x, מהי המשוואה המתארת את סך התשלום?',type:"mcq",

       solution:'כרטיס מבוגר = x+10 (יקר ב-10). 2 כרטיסי מבוגר ו-3 כרטיסי ילד: <b>2(x+10) + 3x = 160</b>'},
      {id:"b",label:"(ב)",text:'מהו מחיר כרטיס ילד (בש"ח)?',type:"number",answer:28,points:5,
       hint:"פתרו: 2(x+10) + 3x = 160",solution:'2x + 20 + 3x = 160 → 5x = 140 → <b>x = 28 ש"ח</b>'},
      {id:"c",label:"(ג)",text:'מהו מחיר כרטיס מבוגר (בש"ח)?',type:"number",answer:38,points:4,
       hint:"כרטיס מבוגר = כרטיס ילד + 10",solution:'מחיר מבוגר = 28 + 10 = <b>38 ש"ח</b>. בדיקה: 2·38 + 3·28 = 76+84 = 160 ✓'}
    ]
  },
  // ===== שאלה 6: בעיה מילולית במערכת — גילים (13 נק') =====
  {
    id:"q6", topic:"systems", points:13, title:"בעיה מילולית — גילים",
    stem:'גילם של אם ובתה יחד הוא 44 שנים. גיל האם גדול פי 3 מגיל הבת.',

      {id:"a",label:"(א)",text:'אם נסמן את גיל הבת ב-x, מהי המשוואה הנכונה?',type:"mcq",

    parts:[
      {id:"a",label:"(א)",text:'מחיר חולצה לאחר הנחה של 25% הוא 90 ש"ח. מה היה המחיר המקורי (בש"ח)?',type:"number",answer:120,points:4,

  // ===== שאלה 8: פיתגורס (11 נק') =====
  {
    id:"q8", topic:"pythagoras", points:11, title:"משפט פיתגורס",
    stem:'במלבן ABCD (ראו סרטוט) האלכסון AC מחלק את המלבן לשני משולשים ישרי-זווית. נתון: אורך הצלע AB = 24 ס"מ, ואורך האלכסון AC = 25 ס"מ.',
    svg:'<svg viewBox="0 0 260 180" style="max-width:250px"><rect x="30" y="30" width="200" height="120" fill="none" stroke="#23201a" stroke-width="2"/><line x1="30" y1="150" x2="230" y2="30" stroke="#0f6e5c" stroke-width="1.8"/><rect x="30" y="138" width="12" height="12" fill="none" stroke="#23201a" stroke-width="1.2"/><text x="20" y="26" font-size="14" font-weight="bold">A</text><text x="232" y="26" font-size="14" font-weight="bold">B</text><text x="232" y="164" font-size="14" font-weight="bold">C</text><text x="20" y="164" font-size="14" font-weight="bold">D</text><text x="120" y="24" font-size="12" fill="#555">24</text><text x="135" y="98" font-size="12" fill="#0f6e5c">25</text></svg>',
    parts:[
      {id:"a",label:"(א)",text:'חשבו את אורך הצלע BC (בס"מ).',type:"number",answer:7,points:5,
       hint:"במשולש ABC ישר-זווית ב-B: AC היתר (25), AB ניצב (24)",solution:'BC² = AC² − AB² = 25² − 24² = 625 − 576 = 49 → BC = <b>7 ס"מ</b> (שלשה 7-24-25)'},
      {id:"b",label:"(ב)",text:'מהו היקף המלבן ABCD (בס"מ)?',type:"number",answer:62,points:3,
       hint:"היקף מלבן = 2·(אורך + רוחב)",solution:'2 · (24 + 7) = 2 · 31 = <b>62 ס"מ</b>'},
      {id:"c",label:"(ג)",text:'מהו שטח המלבן ABCD (בסמ"ר)?',type:"number",answer:168,points:3,
       hint:"שטח מלבן = אורך · רוחב",solution:'24 · 7 = <b>168 סמ"ר</b>'}
    ]
  }
];

// ===== מנוע =====
function parseNum(s){if(s==null)return NaN;let c=String(s).trim().replace(/\s/g,'').replace(',','.');if(c==='')return NaN;if(c.includes('/')){const p=c.split('/');return Number(p[0])/Number(p[1]);}return Number(c);}
function approxEq(a,b,tol){return Math.abs(a-b)<=(tol||0.01);}
let earned={};
let totalPoints=0;
EXAM.forEach(q=>q.parts.forEach(p=>totalPoints+=p.points));
function updateScore(){
  let sum=0;Object.values(earned).forEach(v=>sum+=v);
  const pct=Math.round(sum/totalPoints*100);
  document.getElementById('scoreFill').style.width=pct+'%';
  document.getElementById('scorePct').textContent=sum+' / '+totalPoints;
  let answered=0;EXAM.forEach(q=>q.parts.forEach(p=>{if(earned[q.id+p.id]!==undefined)answered++;}));
  let totalParts=0;EXAM.forEach(q=>totalParts+=q.parts.length);
  if(answered>=totalParts)showFinish(sum,pct);
}
function showFinish(sum,pct){
  if(window.MQ)MQ.record("exam2","מבחן מסכם · ב'",EXAM,earned);
  const box=document.getElementById('finishBox');box.style.display='block';
  document.getElementById('finalScore').textContent=sum+' / '+totalPoints;
  let msg;
  if(pct>=90)msg='מצוין! שליטה מלאה בחומר 🌟';
  else if(pct>=75)msg='כל הכבוד! רמה טובה מאוד';
  else if(pct>=55)msg='לא רע — שווה לחזור על הסעיפים שטעית בהם';
  else msg='כדאי לחזור על החומר ולתרגל שוב. אתה בדרך!';
  document.getElementById('finalMsg').textContent=msg;
  box.scrollIntoView({behavior:'smooth'});
}
function build(){
  const body=document.getElementById('examBody');
  EXAM.forEach((q,qi)=>{
    const card=document.createElement('div');card.className='q';
    card.innerHTML=`<div class="q-head"><span class="q-badge">${qi+1}</span><span class="q-title">${q.title}</span><span class="q-points">${q.points} נק'</span></div><div class="q-stem">${q.stem}</div>${q.svg?`<div class="q-svg">${q.svg}</div>`:''}`;
    q.parts.forEach(p=>card.appendChild(makePart(q,p)));
    body.appendChild(card);
  });
}
function makePart(q,p){
  const div=document.createElement('div');div.className='part';
  const key=q.id+p.id;
  if(p.type==='mcq'){
    div.innerHTML=`<div class="part-q"><span class="part-label">${p.label}</span><span>${p.text}</span><span class="part-pts">${p.points} נק'</span></div><div class="opts"></div><span class="verdict"></span><div class="tools">${p.solution?'<button class="btn-sol">פתרון</button>':''}</div>${p.solution?`<div class="sol-box">${p.solution}</div>`:''}`;
    const opts=div.querySelector('.opts');const verdict=div.querySelector('.verdict');let answered=false;
    p.options.forEach((o,i)=>{
      const b=document.createElement('button');b.className='opt';b.innerHTML=o;
      b.onclick=()=>{if(answered)return;answered=true;
        if(i===p.correct){b.classList.add('ok');verdict.className='verdict ok';verdict.textContent='✓ נכון';earned[key]=p.points;}
        else{b.classList.add('bad');verdict.className='verdict bad';verdict.textContent='✗ לא נכון';opts.children[p.correct].classList.add('reveal');earned[key]=0;}
        updateScore();};
      opts.appendChild(b);
    });
  }else{
    const answers=Array.isArray(p.answer)?p.answer:[p.answer];
    div.innerHTML=`<div class="part-q"><span class="part-label">${p.label}</span><span>${p.text}</span><span class="part-pts">${p.points} נק'</span></div><div class="part-row"><input class="ans" placeholder="תשובה"><button class="btn-check">בדיקה</button><span class="verdict"></span></div><div class="tools">${p.hint?'<button class="btn-hint">💡 רמז</button>':''}${p.solution?'<button class="btn-sol">פתרון</button>':''}</div>${p.hint?`<div class="hint-box">${p.hint}</div>`:''}${p.solution?`<div class="sol-box">${p.solution}</div>`:''}`;
    const input=div.querySelector('.ans');const verdict=div.querySelector('.verdict');
    const check=()=>{const u=parseNum(input.value);
      if(isNaN(u)){input.className='ans bad';verdict.className='verdict bad';verdict.textContent='הזן מספר';return;}
      const ok=answers.some(a=>approxEq(u,a,p.tolerance||(Math.abs(a)<1?0.01:0.05)));
      if(ok){input.className='ans ok';verdict.className='verdict ok';verdict.textContent='✓ נכון';earned[key]=p.points;}
      else{input.className='ans bad';verdict.className='verdict bad';verdict.textContent='✗ נסה שוב';if(earned[key]===undefined)earned[key]=0;}
      updateScore();};
    div.querySelector('.btn-check').onclick=check;
    input.addEventListener('keydown',e=>{if(e.key==='Enter')check();});
  }
  const hintBtn=div.querySelector('.btn-hint');
  if(hintBtn){const hb=div.querySelector('.hint-box');hintBtn.onclick=()=>hb.classList.toggle('show');}
  const solBtn=div.querySelector('.btn-sol');
  if(solBtn){const sb=div.querySelector('.sol-box');solBtn.onclick=()=>sb.classList.toggle('show');}
  return div;
}
build();updateScore();
</script>
